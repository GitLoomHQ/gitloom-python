[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitloom-sdk"
version = "0.2.0"
description = "Python SDK for GitLoom: conversations that cannot outgrow their context window, beside the OpenAI and Anthropic SDKs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "GitLoomHQ" }]
dependencies = ["httpx>=0.24"]
keywords = ["llm", "memory", "conversations", "context", "openai", "anthropic"]

[project.urls]
Homepage = "https://gitloom.cloud"
Documentation = "https://gitloom.cloud/docs/sdk-python.html"
Repository = "https://github.com/GitLoomHQ/gitloom-python"

[tool.hatch.build.targets.wheel]
packages = ["src/gitloom"]
