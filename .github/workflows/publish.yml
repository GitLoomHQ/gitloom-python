name: Publish

# PyPI refuses to replace a released version, so this runs from a GitHub
# Release rather than from every push to main.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for PyPI trusted publishing, if you enable it later

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers here to gate a publish behind a human.
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - run: uv venv && uv pip install -e . pytest httpx
      - run: .venv/bin/python -m pytest tests/ -q

      - name: Tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "${tag#v}" = "$ver" ] || {
            echo "::error::release tag $tag does not match pyproject version $ver"; exit 1; }

      - name: Version is not already on PyPI
        run: |
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$ver/json")
          [ "$code" = "404" ] || { echo "::error::$name $ver is already on PyPI (HTTP $code) — bump the version"; exit 1; }

      - run: uv build

      # Token auth. To move to trusted publishing instead, configure this repo
      # and workflow as a publisher on PyPI and drop the `password` line —
      # id-token: write above is already granted.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
