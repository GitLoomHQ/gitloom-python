name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject and the current release. A syntax or
        # typing feature that slipped past the floor fails on 3.9, not on a
        # user's machine.
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e . pytest httpx
      - run: .venv/bin/python -m pytest tests/ -q

      # The wheel is what users install; a packaging mistake is invisible to a
      # suite that imports from the source tree.
      - name: Build and import the wheel
        run: |
          uv build
          uv venv --python ${{ matrix.python }} /tmp/wheeltest
          # `uv venv` creates an environment with no pip in it, so install
          # into it with uv rather than through the interpreter.
          uv pip install --python /tmp/wheeltest/bin/python dist/*.whl
          /tmp/wheeltest/bin/python -c "import gitloom; print('import ok:', gitloom.__name__)"

      # docs/README.md is what GitBook Git-syncs into this SDK's documentation
      # space. It is a copy, so a README change that skips it silently leaves
      # the published docs describing an older API.
      - name: GitBook copy matches the README
        run: |
          diff -u README.md docs/README.md \
            || { echo "::error::run 'cp README.md docs/README.md' and commit it"; exit 1; }
